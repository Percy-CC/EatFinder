<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>食乜好</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{color-scheme:light;--page:#fafafa;--surface:#fff;--text:#222;--muted:#666;--border:#ddd;--line:#eee;--control:#fff;--accent:#222;--accent-text:#fff;--link:#0057a8}
:root[data-theme="dark"]{color-scheme:dark;--page:#17191b;--surface:#222629;--text:#edf0f2;--muted:#abb2b8;--border:#444b50;--line:#353b40;--control:#2b3034;--accent:#edf0f2;--accent-text:#17191b;--link:#91c4ff}
body{font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:12px;background:var(--page);color:var(--text)}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.title-row h2{margin:0}
.title-row button{width:auto}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px;border:1px solid var(--border);background:var(--control);color:var(--text)}
nav button.on{background:var(--accent);color:var(--accent-text)}
section{display:none;background:var(--surface);padding:12px;border:1px solid var(--border);margin-bottom:12px}
section.on{display:block}
input,select,textarea,button{font-size:16px;padding:8px;margin:4px 0;width:100%;box-sizing:border-box;color:var(--text);background:var(--control);border:1px solid var(--border)}
input[type="radio"]{accent-color:var(--link)}
button{cursor:pointer}
a{color:var(--link)}
#mapBox{height:60vh;min-height:320px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--text)}
.row{display:flex;gap:6px}
.card{border-bottom:1px solid var(--line);padding:8px 0}
.small{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="title-row">
<h2>食乜好</h2>
<button id="themeToggle" type="button" aria-pressed="false">深色模式</button>
</div>
<div class="row">
<select id="meSel"></select>
<button id="addMember" style="width:auto">新增名字</button>
<button id="delMember" style="width:auto">剷除名字</button>
</div>
<nav>
<button data-t="today" class="on">今日</button>
<button data-t="review">食評</button>
<button data-t="list">餐廳</button>
<button data-t="mapSec">地圖</button>
</nav>

<section id="today" class="on">
<h3>今日午餐 <span id="dayLabel" class="small"></span></h3>
<div class="small" id="timeHint"></div>
<label><input type="radio" name="join" value="yes" style="width:auto"> 一齊食</label>
<label><input type="radio" name="join" value="no" style="width:auto"> 今日唔食</label>
<select id="choiceDistrict"></select>
<select id="choice"></select>
<button id="addRestBtn1">搵唔到？新增餐廳</button>
<button id="saveIntent">儲存</button>
<h3>想一齊食嘅人</h3>
<div id="intents"></div>
<h3>投票</h3>
<div id="voteBox"></div>
</section>

<section id="review">
<h3>寫食評</h3>
<select id="rvDistrict"></select>
<select id="rvRest"></select>
<button id="addRestBtn2">搵唔到？新增餐廳</button>
<select id="rvStar"></select>
<textarea id="rvText" rows="3" placeholder="食評（選填）"></textarea>
<button id="saveReview">提交食評</button>
<h3>最新食評</h3>
<div id="reviews"></div>
</section>

<section id="list">
<h3>餐廳清單</h3>
<select id="fDistrict"></select>
<div id="rests"></div>
<h3>新增餐廳</h3>
<input id="nName" placeholder="餐廳名稱（必填）">
<select id="nDistrict"></select>
<input id="nAddr" placeholder="地址（選填，貼上後自動判斷地區）">
<div class="small" id="distHint"></div>
<input id="nMap" placeholder="Google Maps 連結（必填）">
<input id="nOR" placeholder="OpenRice 連結（選填）">
<input id="nLL" placeholder="座標（選填）例如 22.3193,114.1694">
<button id="saveRest">新增</button>
</section>

<section id="mapSec">
<h3>餐廳地圖</h3>
<select id="mDistrict"></select>
<label><input type="checkbox" id="mToday" style="width:auto"> 只顯示今日候選</label>
<button id="locBtn" type="button">我的位置</button>
<div id="mapBox"></div>
<div class="small" id="mapNote"></div>
</section>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore,collection,doc,setDoc,addDoc,updateDoc,deleteDoc,writeBatch,onSnapshot,serverTimestamp,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCmDo6d8eHq9DNlpR0RToHKQ5_YbKa-Rys",
    authDomain: "eatlunch-d7a7a.firebaseapp.com",
    projectId: "eatlunch-d7a7a",
    storageBucket: "eatlunch-d7a7a.firebasestorage.app",
    messagingSenderId: "501916186969",
    appId: "1:501916186969:web:6937555f96fb593f017448",
    measurementId: "G-7D3FDR771N"
  };
const db=getFirestore(initializeApp(firebaseConfig));

const DISTRICTS=["中西區","灣仔","東區","南區","油尖旺","深水埗","九龍城","黃大仙","觀塘","荃灣","屯門","元朗","北區","大埔","沙田","西貢","葵青","離島"];

"南區":["南區","薄扶林","香港仔","鴨脷洲","黃竹坑","淺水灣","赤柱","大潭","石澳","Pok Fu Lam","Aberdeen","Ap Lei Chau","Wong Chuk Hang","Repulse Bay","Stanley","Tai Tam","Shek O"],
"油尖旺":["油尖旺","尖沙咀","佐敦","油麻地","旺角","大角咀","Tsim Sha Tsui","Jordan","Yau Ma Tei","Mong Kok","Tai Kok Tsui"],
"深水埗":["深水埗","長沙灣","荔枝角","石硤尾","Sham Shui Po","Cheung Sha Wan","Lai Chi Kok","Shek Kip Mei"],
"九龍城":["九龍城","紅磡","土瓜灣","何文田","九龍塘","Kowloon City","Hung Hom","To Kwa Wan","Ho Man Tin","Kowloon Tong"],
"黃大仙":["黃大仙","鑽石山","新蒲崗","樂富","彩虹","Wong Tai Sin","Diamond Hill","San Po Kong","Lok Fu","Choi Hung"],
"觀塘":["觀塘","牛頭角","九龍灣","藍田","油塘","Kwun Tong","Ngau Tau Kok","Kowloon Bay","Lam Tin","Yau Tong"],

"北區":["上水","粉嶺","Sheung Shui","Fanling"],
"大埔":["大埔","Tai Po"],
"沙田":["沙田","馬鞍山","火炭","Sha Tin","Ma On Shan","Fo Tan"],

"葵青":["葵涌","青衣","葵芳","Kwai Chung","Tsing Yi","Kwai Fong"],
"離島":["東涌","長洲","大嶼山","梅窩","南丫島","坪洲","Tung Chung","Cheung Chau","Lantau","Mui Wo","Lamma","Peng Chau"]
};
function detectDistrict(addr){
  const s=addr.toLowerCase();let best=null,len=0;
  for(const [d,ks] of Object.entries(DK))for(const k of ks){
    if(s.includes(k.toLowerCase())&&k.length>len){best=d;len=k.length;}
  }
  return best;
}
const $=id=>document.getElementById(id);
const savedTheme=localStorage.getItem("theme");
const initialTheme=savedTheme==="dark"||savedTheme==="light"?savedTheme:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  $("themeToggle").textContent=theme==="dark"?"淺色模式":"深色模式";
  $("themeToggle").setAttribute("aria-pressed",String(theme==="dark"));
}
applyTheme(initialTheme);
$("themeToggle").onclick=()=>{
  const theme=document.documentElement.dataset.theme==="dark"?"light":"dark";
  localStorage.setItem("theme",theme);
  applyTheme(theme);
};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Hong_Kong"});
const hkTime=()=>new Date().toLocaleTimeString("en-GB",{timeZone:"Asia/Hong_Kong",hour:"2-digit",minute:"2-digit"});

let me=localStorage.getItem("me")||"";
const S={members:[],rests:[],reviews:[],intents:[],votes:[],day:{}};
let dayKey=today(),unsubs=[];

function fillSelect(el,items,first){
  el.innerHTML=(first!==undefined?`<option value="">${first}</option>`:"")+items.map(i=>`<option value="${esc(i)}">${esc(i)}</option>`).join("");
}
fillSelect($("rvDistrict"),DISTRICTS,"全部地區");
fillSelect($("fDistrict"),DISTRICTS,"全部地區");
fillSelect($("nDistrict"),DISTRICTS);
fillSelect($("mDistrict"),DISTRICTS,"全部地區");
fillSelect($("choiceDistrict"),DISTRICTS,"全部地區");
$("rvStar").innerHTML=[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n==3?"selected":""}>${n} 星</option>`).join("");

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button,section").forEach(e=>e.classList.remove("on"));
  b.classList.add("on");$(b.dataset.t).classList.add("on");
  if(b.dataset.t==="mapSec")showMap();
});
const goList=()=>document.querySelector('[data-t="list"]').click();
$("addRestBtn1").onclick=goList;$("addRestBtn2").onclick=goList;

const needMe=()=>{if(!me){alert("請先喺上面下拉選單揀你嘅名");return false}return true;};

$("meSel").onchange=()=>{me=$("meSel").value;localStorage.setItem("me",me);render();};
$("addMember").onclick=async()=>{
  const n=(prompt("輸入新名字")||"").trim();
  if(!n)return;
  if(S.members.some(m=>m.name===n))return alert("已有相同名字");
  await addDoc(collection(db,"members"),{name:n,ts:serverTimestamp()});
  me=n;localStorage.setItem("me",me);
};
$("delMember").onclick=async()=>{
  const m=S.members.find(x=>x.name===$("meSel").value);
  if(!m)return alert("請先喺下拉選單揀要剷除嘅名");
  if(!confirm("確定剷除「"+m.name+"」？"))return;
  await deleteDoc(doc(db,"members",m.id));
  if(me===m.name){me="";localStorage.removeItem("me");}
};

const rName=id=>S.rests.find(r=>r.id===id)?.name||"（已刪除）";
function stats(id){
  const rs=S.reviews.filter(r=>r.restId===id);
  const avg=rs.length?(rs.reduce((a,b)=>a+b.rating,0)/rs.length).toFixed(1):"-";
  return {avg,n:rs.length};
}

function listen(ref,key,q){
  return onSnapshot(q||ref,snap=>{
    S[key]=snap.docs.map(d=>({id:d.id,...d.data()}));render();
  });
}
function attach(){
  unsubs.forEach(u=>u());unsubs=[];
  dayKey=today();
  $("dayLabel").textContent=dayKey;
  unsubs.push(listen(collection(db,"members"),"members",query(collection(db,"members"),orderBy("ts"))));
  unsubs.push(listen(collection(db,"restaurants"),"rests"));
  unsubs.push(listen(collection(db,"reviews"),"reviews",query(collection(db,"reviews"),orderBy("ts","desc"))));
  unsubs.push(listen(collection(db,"days",dayKey,"intents"),"intents"));
  unsubs.push(listen(collection(db,"days",dayKey,"votes"),"votes"));
  unsubs.push(onSnapshot(doc(db,"days",dayKey),d=>{S.day=d.data()||{};render();}));
}
attach();
setInterval(()=>{if(today()!==dayKey)attach();render();},60000);

$("saveIntent").onclick=async()=>{
  if(!needMe())return;
  const j=document.querySelector('input[name="join"]:checked');
  if(!j)return alert("請揀一齊食定唔食");
  await setDoc(doc(db,"days",dayKey,"intents",me),{name:me,joining:j.value==="yes",choice:j.value==="yes"?($("choice").value||"any"):"",ts:serverTimestamp()});
};

const EXPAND_URL="https://script.google.com/macros/s/AKfycbzzAJ2IIf2kEUrIOB3Jsiq-NGiVvsEro790xwLul8VmjUAxRHTCJ0gfrZNkz9V6i1ukRQ/exec";

async function expandUrl(u){
  if(!/maps\.app\.goo\.gl|goo\.gl\/maps/.test(u))return u;
  if(!EXPAND_URL.startsWith("https://"))throw new Error("未設定 EXPAND_URL");
  const r=await fetch(EXPAND_URL+"?u="+encodeURIComponent(u));
  const j=await r.json();
  if(!j.url)throw new Error("展開失敗");
  return j.url;
}
function parseCoords(u){
  let s=u;try{s=decodeURIComponent(u);}catch(e){}
  const m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/);
  return m?{lat:+m[1],lng:+m[2]}:null;
}
async function coordsFromLink(u){return parseCoords(await expandUrl(u));}
function parseLL(t){
  const m=t.match(/(-?\d+(?:\.\d+)?)\s*[,，]\s*(-?\d+(?:\.\d+)?)/);
  if(!m)return null;
  const lat=+m[1],lng=+m[2];
  return(lat>=-90&&lat<=90&&lng>=-180&&lng<=180)?{lat,lng}:null;
}

let map=null,layer=null,meLayer=null,myLL=null;
function showMap(){
  if(!window.L){$("mapNote").textContent="地圖程式庫載入失敗";return;}
  if(!map){
    map=L.map("mapBox").setView([22.32,114.17],11);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
    layer=L.layerGroup().addTo(map);
    meLayer=L.layerGroup().addTo(map);
    map.on("locationfound",onFound);
    map.on("locationerror",onLocErr);
  }
  setTimeout(()=>{map.invalidateSize();drawMap(true);},0);
}
function resetLocBtn(){$("locBtn").disabled=false;$("locBtn").textContent="我的位置";}
function onFound(e){
  myLL=e.latlng;
  meLayer.clearLayers();
  L.circle(e.latlng,{radius:e.accuracy,color:"#1a73e8",weight:1,fillOpacity:0.1}).addTo(meLayer);
  L.circleMarker(e.latlng,{radius:8,color:"#fff",weight:2,fillColor:"#1a73e8",fillOpacity:1}).addTo(meLayer).bindPopup("你喺呢度（誤差約 "+Math.round(e.accuracy)+" 米）");
  resetLocBtn();
  drawMap(false);
}
function onLocErr(e){
  resetLocBtn();
  alert("搵唔到你嘅位置："+e.message+"\n請確認已允許瀏覽器使用位置，並開啟手機定位服務。");
}
$("locBtn").onclick=()=>{
  if(!map)return;
  $("locBtn").disabled=true;$("locBtn").textContent="定位中…";
  map.locate({setView:true,maxZoom:16,enableHighAccuracy:true,timeout:10000});
};
function drawMap(fit){
  if(!map)return;
  layer.clearLayers();
  const d=$("mDistrict").value,onlyToday=$("mToday").checked;
  const todayIds=new Set(S.intents.filter(i=>i.joining&&i.choice&&i.choice!=="any").map(i=>i.choice));
  const list=S.rests.filter(r=>(!d||r.district===d)&&(!onlyToday||todayIds.has(r.id)));
  const withLL=list.filter(r=>typeof r.lat==="number"&&typeof r.lng==="number");
  const pts=[];
  withLL.forEach(r=>{
    const s=stats(r.id);
    const dist=myLL?map.distance(myLL,[r.lat,r.lng]):null;
    const dtxt=dist==null?"":`<br>距離你約 ${dist<1000?Math.round(dist)+" 米":(dist/1000).toFixed(1)+" 公里"}（直線）`;
    const html=`<b>${esc(r.name)}</b>（${esc(r.district)}）<br>${s.n?esc(s.avg)+" 星・"+s.n+" 則食評":"未有評分"}${dtxt}<br><a href="${esc(r.gmap)}" target="_blank" rel="noopener">Google Maps</a>${r.openrice?` | <a href="${esc(r.openrice)}" target="_blank" rel="noopener">OpenRice</a>`:""}`;
    L.marker([r.lat,r.lng]).addTo(layer).bindPopup(html);
    pts.push([r.lat,r.lng]);
  });
  if(fit&&pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:16});
  $("mapNote").textContent=`顯示 ${withLL.length} 間；冇座標：${list.length-withLL.length} 間（喺「餐廳」頁按「補座標」）`;
}
$("mDistrict").onchange=()=>drawMap(true);
$("mToday").onchange=()=>drawMap(true);

window.fixCoords=async id=>{
  const r=S.rests.find(x=>x.id===id);if(!r)return;
  let c=null;
  try{c=await coordsFromLink(r.gmap);}catch(e){}
  if(!c){
    const t=prompt("自動讀取失敗。請輸入座標（緯度,經度），例如 22.3193,114.1694");
    if(!t)return;
    c=parseLL(t);
    if(!c)return alert("格式不正確");
  }
  await updateDoc(doc(db,"restaurants",id),{lat:c.lat,lng:c.lng});
};

$("saveRest").onclick=async()=>{
  if(!needMe())return;
  const name=$("nName").value.trim(),gm=$("nMap").value.trim(),or=$("nOR").value.trim(),ll=$("nLL").value.trim();
  if(!name||!gm)return alert("餐廳名稱同 Google Maps 連結必填");
  if(!/^https?:\/\//.test(gm)||(or&&!/^https?:\/\//.test(or)))return alert("連結要以 http 或 https 開頭");
  let c=null;
  if(ll){c=parseLL(ll);if(!c)return alert("座標格式：緯度,經度（例如 22.3193,114.1694）");}
  else{try{c=await coordsFromLink(gm);}catch(e){}}
  const data={name,district:$("nDistrict").value,address:$("nAddr").value.trim(),gmap:gm,openrice:or,addedBy:me,ts:serverTimestamp()};
  if(c){data.lat=c.lat;data.lng=c.lng;}
  await addDoc(collection(db,"restaurants"),data);
  ["nName","nAddr","nMap","nOR","nLL"].forEach(i=>$(i).value="");
  $("distHint").textContent="";
  if(!c)alert("已新增，但讀唔到座標，地圖上唔會顯示。可喺餐廳清單按「補座標」。");
};

$("saveReview").onclick=async()=>{
  if(!needMe())return;
  const restId=$("rvRest").value;
  if(!restId)return alert("請揀餐廳");
  await addDoc(collection(db,"reviews"),{restId,rating:Number($("rvStar").value),text:$("rvText").value.trim(),by:me,ts:serverTimestamp()});
  $("rvText").value="";
};

window.delRest=async id=>{
  const r=S.rests.find(x=>x.id===id);if(!r)return;
  const rv=S.reviews.filter(x=>x.restId===id);
  if(!confirm("確定刪除「"+r.name+"」？\n同時會刪除 "+rv.length+" 則食評，無法還原。"))return;
  const b=writeBatch(db);
  rv.forEach(x=>b.delete(doc(db,"reviews",x.id)));
  b.delete(doc(db,"restaurants",id));
  await b.commit();
};
window.delReview=async id=>{if(confirm("刪除呢個食評？"))await deleteDoc(doc(db,"reviews",id));};
window.editReview=async id=>{
  const r=S.reviews.find(x=>x.id===id);if(!r)return;
  const s=prompt("星數（0–5）",r.rating);if(s===null)return;
  const n=Number(s);
  if(!Number.isInteger(n)||n<0||n>5)return alert("星數要係 0 至 5 嘅整數");
  const t=prompt("食評內容",r.text||"");if(t===null)return;
  await updateDoc(doc(db,"reviews",id),{rating:n,text:t.trim(),editedBy:me||""});
};
window.vote=async id=>{if(!needMe())return;await setDoc(doc(db,"days",dayKey,"votes",me),{name:me,restId:id,ts:serverTimestamp()});};
window.closeVote=async()=>{
  const cands=[...new Set(S.intents.filter(i=>i.joining&&i.choice&&i.choice!=="any").map(i=>i.choice))].filter(id=>S.rests.some(r=>r.id===id));
  let winner="any";
  if(cands.length){
    const c={};cands.forEach(k=>c[k]=0);
    S.votes.forEach(v=>{if(c[v.restId]!==undefined)c[v.restId]++;});
    const max=Math.max(...Object.values(c));
    const top=cands.filter(k=>c[k]===max);
    winner=top[Math.floor(Math.random()*top.length)];
  }
  await setDoc(doc(db,"days",dayKey),{closed:true,winner},{merge:true});
};
window.reopenVote=async()=>{await setDoc(doc(db,"days",dayKey),{closed:false,winner:null},{merge:true});};

function render(){
  fillSelect($("meSel"),S.members.map(m=>m.name),"— 揀你嘅名 —");
  $("meSel").value=S.members.some(m=>m.name===me)?me:"";
  if(me&&!S.members.some(m=>m.name===me)&&S.members.length)me="";

  const t=hkTime();
  $("timeHint").textContent=(t>="12:00"&&t<="12:30")?"而家係填寫時段（12:00–12:30）":"建議填寫時間：12:00–12:30（唔係強制）";

  const cur=$("choice").value,cd=$("choiceDistrict").value;
  const label=r=>{
    const s=stats(r.id);
    const k=s.n?Math.round(Number(s.avg)):0;
    const rt=s.n?`${"★".repeat(k)}${"☆".repeat(5-k)} ${s.avg}（${s.n}則）`:"未有評分";
    return `${r.name}（${r.district}）${rt}`;
  };
  $("choice").innerHTML=`<option value="any">冇所謂</option>`+S.rests.filter(r=>!cd||r.district===cd).map(r=>`<option value="${esc(r.id)}">${esc(label(r))}</option>`).join("");
  if(cur&&[...$("choice").options].some(o=>o.value===cur))$("choice").value=cur;

  const fd=$("rvDistrict").value,curR=$("rvRest").value;
  $("rvRest").innerHTML='<option value="">揀餐廳</option>'+S.rests.filter(r=>!fd||r.district===fd).map(r=>`<option value="${esc(r.id)}">${esc(r.name)}（${esc(r.district)}）</option>`).join("");
  $("rvRest").value=curR;

  const joiners=S.intents.filter(i=>i.joining);
  $("intents").innerHTML=joiners.length?joiners.map(i=>`<div class="card">${esc(i.name)}：${i.choice==="any"?"冇所謂":esc(rName(i.choice))}</div>`).join(""):"暫時冇人";

  const cands=[...new Set(joiners.filter(i=>i.choice&&i.choice!=="any").map(i=>i.choice))].filter(id=>S.rests.some(r=>r.id===id));
  const cnt={};S.votes.forEach(v=>cnt[v.restId]=(cnt[v.restId]||0)+1);
  const myVote=S.votes.find(v=>v.name===me)?.restId;
  let h="";
  if(!joiners.length)h="未有人報名。";
  else if(!cands.length)h="所有人都話冇所謂，唔使投票。";
  else{
    h=cands.map(id=>`<div class="card">${esc(rName(id))}　${cnt[id]||0} 票 ${S.day.closed?"":`<button onclick="vote('${id}')">${myVote===id?"已投（可改）":"投呢間"}</button>`}</div>`).join("");
    h+=S.day.closed?`<h3>結果：${esc(rName(S.day.winner))}</h3><button onclick="reopenVote()">重開投票</button>`:`<button onclick="closeVote()">截止投票</button>`;
  }
  $("voteBox").innerHTML=h;

  const f=$("fDistrict").value;
  $("rests").innerHTML=S.rests.filter(r=>!f||r.district===f).map(r=>{const s=stats(r.id);return `<div class="card"><b>${esc(r.name)}</b>（${esc(r.district)}）<br>平均 ${s.avg} 星・${s.n} 則食評<br><a href="${esc(r.gmap)}" target="_blank" rel="noopener">Google Maps</a>${r.openrice?` | <a href="${esc(r.openrice)}" target="_blank" rel="noopener">OpenRice</a>`:""}${typeof r.lat==="number"?"":` | <a href="#" onclick="fixCoords('${r.id}');return false">補座標</a>`} | <a href="#" onclick="delRest('${r.id}');return false">刪除</a></div>`}).join("")||"未有餐廳";

  $("reviews").innerHTML=S.reviews.map(r=>`<div class="card"><b>${esc(rName(r.restId))}</b>　${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}<br>${esc(r.text)}<div class="small">${esc(r.by)}${r.editedBy?"（"+esc(r.editedBy)+" 已修改）":""} <a href="#" onclick="editReview('${r.id}');return false">修改</a> <a href="#" onclick="delReview('${r.id}');return false">刪除</a></div></div>`).join("")||"未有食評";
  if(map&&$("mapSec").classList.contains("on"))drawMap(false);
}
$("fDistrict").onchange=render;$("rvDistrict").onchange=render;$("choiceDistrict").onchange=render;
$("nAddr").oninput=()=>{
  const d=detectDistrict($("nAddr").value);
  if(d){$("nDistrict").value=d;$("distHint").textContent="已自動判斷地區："+d+"（可手動更改）";}
  else{$("distHint").textContent=$("nAddr").value?"判斷唔到地區，請手動選擇":"";}
};
</script>
</body>
